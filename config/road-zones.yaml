road_zones:
  zones:
    - id: "zone_courtyard"
      type: "pedestrian-only"
      name: "Family Courtyard"
      name_hi: "घर का आँगन"
      bounds:
        min_x: -4.94
        max_x: 4.8
        min_z: -2.86
        max_z: 5.93
      bicycle_permitted: false
      restriction_message_en: "Pedestrian only: Please dismount before entering the family courtyard."
      restriction_message_hi: "केवल पैदल: घर के आँगन में आने से पहले कृपया साइकिल से उतरें।"

    - id: "zone_village_lane"
      type: "bicycle-road"
      name: "Village Main Lane"
      name_hi: "गाँव की मुख्य सड़क"
