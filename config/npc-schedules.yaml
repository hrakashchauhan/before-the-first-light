schedules:
  - character_id: "npc_mother"
    phases:
      - time_of_day: "morning"
        location_anchor: "npc_mother"
        activity: "Veranda guidance, supervising sacred grain drying"
        activity_hi: "बरामदे में बैठकर पवित्र अन्न की देखरेख"
      - time_of_day: "afternoon"
        location_anchor: "prop_chulha"
        activity: "Inspecting traditional clay hearth and mango firewood"
        activity_hi: "मिट्टी के चूल्हे और आम की लकड़ी की जाँच"
      - time_of_day: "evening"
        location_anchor: "npc_mother"
        activity: "Preparing offerings for Sandhya Arghya"
        activity_hi: "संध्या अर्घ्य के लिए सूप और दउरा की तैयारी"
      - time_of_day: "sunrise"
        location_anchor: "prop_ghat_spot"
        activity: "Offering arghya in water at first light"
        activity_hi: "तालाब के पानी में खड़े होकर उषा अर्घ्य अर्पण"

  - character_id: "npc_artisan"
    phases:
      - time_of_day: "morning"
        location_anchor: "npc_artisan"
        activity: "Splitting green bamboo and shaping soop frames"
        activity_hi: "हरे बाँस की कमचियों से सूप और दउरा बुनना"
      - time_of_day: "evening"
        location_anchor: "npc_artisan"
        activity: "Handing finished sacred baskets to villagers"
        activity_hi: "गाँव वालों को पूजा की टोकरियाँ सौंपना"

  - character_id: "npc_father"
    phases:
      - time_of_day: "morning"
        location_anchor: "npc_father"
        activity: "Chopping and drying pure mango wood for the prasad hearth"
        activity_hi: "प्रसाद के चूल्हे के लिए आम की सूखी लकड़ी तैयार करना"
      - time_of_day: "afternoon"
        location_anchor: "npc_father"
        activity: "Checking granary bags and inspecting courtyard arrangements"
        activity_hi: "अन्न के बोरों और आँगन की व्यवस्था की देखरेख"
      - time_of_day: "evening"
        location_anchor: "npc_father"
        activity: "Preparing bamboo bahangi carrying poles for the ghat procession"
        activity_hi: "घाट जाने के लिए बाँस की बहँगी तैयार करना"
      - time_of_day: "sunrise"
        location_anchor: "prop_ghat_spot"
        activity: "Holding the sacred daura basket with family during Usha Arghya"
        activity_hi: "उषा अर्घ्य के समय परिवार के साथ दउरा थामना"

  - character_id: "npc_dadi"
    phases:
      - time_of_day: "morning"
        location_anchor: "npc_dadi"
        activity: "Seated on courtyard charpai, reciting traditional Chhath geet and blessings"
        activity_hi: "आँगन के खटोले पर बैठकर पारंपरिक छठ गीत गाना और आशीर्वाद देना"
      - time_of_day: "afternoon"
        location_anchor: "npc_dadi"
        activity: "Guiding ritual purity rules and blessing household preparations"
        activity_hi: "पूजा की शुद्धि और पवित्रता के नियमों का मार्गदर्शन"
      - time_of_day: "evening"
        location_anchor: "npc_dadi"
        activity: "Overseeing the lighting of first ghee lamps at dusk"
        activity_hi: "शाम को शुद्ध घी के पहले दीये जलवाने की देखरेख"
      - time_of_day: "sunrise"
        location_anchor: "npc_dadi"
        activity: "Welcoming the family home from the ghat with sacred prasad"
        activity_hi: "घाट से लौटे परिवार का पावन प्रसाद के साथ स्वागत"

  - character_id: "npc_neighbour"
    phases:
      - time_of_day: "morning"
        location_anchor: "npc_neighbour"
        activity: "Sweeping village lane and smoothing the earthen approach to the pond"
        activity_hi: "गाँव की सड़क और तालाब के रास्ते की सफाई करना"
      - time_of_day: "evening"
        location_anchor: "npc_neighbour"
        activity: "Arranging clay lamps (diya) and marigold garlands along the brick steps"
        activity_hi: "सीढ़ियों पर मिट्टी के दीये और गेंदे की मालाएँ सजाना"
      - time_of_day: "sunrise"
        location_anchor: "npc_neighbour"
        activity: "Offering arghya and exchanging prasad with neighbouring families"
        activity_hi: "आस-पड़ोस के परिवारों के साथ अर्घ्य अर्पण और प्रसाद का आदान-प्रदान"
