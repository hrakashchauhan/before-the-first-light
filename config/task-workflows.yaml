workflows:
  - id: "wf_homecoming"
    chapter_id: "homecoming"
    steps:
      - step: 1
        instruction_en: "Walk across the courtyard towards the veranda."
        instruction_hi: "आँगन पार करके बरामदे की ओर जाएँ।"
        target_id: "npc_mother"
        action: "talk"
      - step: 2
        instruction_en: "Listen to Ma's plan for the morning preparations."
        instruction_hi: "सुबह की तैयारियों के बारे में माँ से सुनें।"
        target_id: "npc_mother"
        action: "listen"

  - id: "wf_courtyard_prep"
    chapter_id: "courtyard-preparation"
    steps:
      - step: 1
        instruction_en: "Walk to the left corner of the veranda to pick up the grass broom."
        instruction_hi: "बरामदे के बाईं ओर जाकर झाड़ू लें।"
        target_id: "prop_broom"
        action: "pickup"
      - step: 2
        instruction_en: "Sweep fallen dry leaves away from the earthen floor."
        instruction_hi: "कच्चे आँगन से सूखी पत्तियाँ बुहारें।"
        target_id: "prop_broom"
        action: "sweep"
      - step: 3
        instruction_en: "Confirm with Ma that the ground is sanctified."
        instruction_hi: "माँ को बताएँ कि आँगन साफ़ हो गया है।"
        target_id: "npc_mother"
        action: "report"

  - id: "wf_bicycle_journey_artisan"
    chapter_id: "village-cooperation"
    steps:
      - step: 1
        instruction_en: "Approach the bicycle parked at the courtyard gate."
        instruction_hi: "आँगन के फाटक पर खड़ी साइकिल के पास जाएँ।"
        target_id: "prop_bicycle"
        action: "mount"
      - step: 2
        instruction_en: "Ride down the village lane towards Mohan Kaka's workshop."
        instruction_hi: "मोहन काका की दुकान की ओर सड़क पर साइकिल चलाएँ।"
        target_id: "npc_artisan"
        action: "ride"
      - step: 3
        instruction_en: "Brake smoothly and dismount in the artisan parking area."
        instruction_hi: "कारीगर के सामने साइकिल रोककर उतरें।"
        target_id: "npc_artisan"
        action: "dismount"
      - step: 4
        instruction_en: "Collect the handmade bamboo baskets."
        instruction_hi: "हाथ से बनी बाँस की टोकरियाँ लें।"
        target_id: "npc_artisan"
        action: "collect"
      - step: 5
        instruction_en: "Ride back to the household and deliver the baskets to Ma."
        instruction_hi: "साइकिल से घर लौटकर टोकरियाँ माँ को दें।"
        target_id: "npc_mother"
        action: "deliver"

  - id: "wf_ghat_preparation"
    chapter_id: "festival-eve"
    steps:
      - step: 1
        instruction_en: "Mount bicycle and ride down the lane to the pond."
        instruction_hi: "साइकिल पर बैठकर तालाब की ओर बढ़ें।"
        target_id: "prop_bicycle"
        action: "ride"
      - step: 2
        instruction_en: "Park at the upper threshold outside the ritual boundary."
        instruction_hi: "पवित्र सीढ़ियों से पहले साइकिल खड़ी करें।"
        target_id: "prop_ghat_spot"
        action: "park"
      - step: 3
        instruction_en: "Walk down the brick steps to inspect the ghat."
        instruction_hi: "सीढ़ियों पर उतरकर घाट की तैयारी देखें।"
        target_id: "prop_ghat_spot"
        action: "inspect"

  - id: "wf_usha_arghya_dawn"
    chapter_id: "usha-arghya"
    steps:
      - step: 1
        instruction_en: "Join the community assembled at the sacred pond steps."
        instruction_hi: "तालाब की सीढ़ियों पर गाँव वालों के साथ खड़े हों।"
        target_id: "prop_ghat_spot"
        action: "gather"
      - step: 2
        instruction_en: "Witness the morning sun break across the water with the devotional theme."
        instruction_hi: "पानी पर उगते सूरज और पावन संगीत का अनुभव करें।"
        target_id: "prop_ghat_spot"
        action: "witness"

  - id: "wf_parana_epilogue"
    chapter_id: "parana-epilogue"
    steps:
      - step: 1
        instruction_en: "Return to the courtyard veranda to join Ma and family."
        instruction_hi: "बरामदे में माँ और परिवार के पास लौटें।"
        target_id: "npc_mother"
        action: "return"
      - step: 2
        instruction_en: "Share the sacred thekua prasad with everyone who helped."
        instruction_hi: "सहायता करने वाले सभी लोगों में पावन प्रसाद बाँटें।"
        target_id: "npc_mother"
        action: "share"
